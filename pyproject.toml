[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rta-smriti-brain"
version = "1.0.1a1"
description = "Local-first project memory, repo graph, context-pack, and MCP brain for AI coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Sulabh Dubey" }
]
keywords = ["codex", "mcp", "agent-memory", "knowledge-graph", "sqlite", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Text Processing :: Indexing"
]
dependencies = [
  "tree-sitter-language-pack>=1.13.3,<2",
  "cryptography>=50,<51"
]

[project.optional-dependencies]
tree-sitter = []
embeddings = ["sentence-transformers>=5.6.1,<6"]
tokenization = ["tiktoken>=0.9,<1"]
watcher = ["watchdog>=6,<7"]
binary = ["pyinstaller>=6.14,<7"]
signing = []
all-local = [
  "sentence-transformers>=5.6.1,<6",
  "tiktoken>=0.9,<1",
  "watchdog>=6,<7"
]

[project.urls]
Homepage = "https://sulabhdubey.github.io/rta-smriti-brain/"
Repository = "https://github.com/sulabhdubey/rta-smriti-brain"
Issues = "https://github.com/sulabhdubey/rta-smriti-brain/issues"
Documentation = "https://github.com/sulabhdubey/rta-smriti-brain/blob/main/docs/USAGE_GUIDE.md"

[project.scripts]
rta-brain = "rta_brain.cli:main"
rta-brain-mcp = "rta_brain.mcp_server:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["rta_brain"]
namespaces = false

[tool.setuptools.package-data]
rta_brain = ["data/*.json", "static/*", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
