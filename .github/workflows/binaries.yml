name: Native binaries

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  supply-chain-scan:
    name: Supply-chain secret scan
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan repository history with Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  build:
    needs: supply-chain-scan
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: rta-smriti-windows-x64
            executable: dist/rta-brain.exe
            lock: constraints/release-windows-py312.txt
          - os: macos-latest
            artifact: rta-smriti-macos
            executable: dist/rta-brain
            lock: constraints/release-macos-py312.txt
          - os: ubuntu-latest
            artifact: rta-smriti-linux-x64
            executable: dist/rta-brain
            lock: constraints/release-linux-py312.txt
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.lock }}
      - name: Install hash-locked release toolchain
        run: python -m pip install --require-hashes -r ${{ matrix.lock }}
      - name: Install local release source without dependency resolution
        run: python -m pip install --no-build-isolation --no-deps .
      - name: Audit dependencies and generate CycloneDX SBOM
        run: pip-audit . --format cyclonedx-json --output release-sbom.cdx.json --progress-spinner off --strict
      - name: Build executable
        run: python scripts/build_binary.py
      - name: Smoke test executable
        run: python scripts/smoke_binary.py
      - name: Stage versioned binary and SHA256SUMS.txt
        if: matrix.os != 'ubuntu-latest'
        run: python scripts/package_release_artifacts.py --sbom release-sbom.cdx.json
      - name: Stage versioned binary, wheel, and SHA256SUMS.txt
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/package_release_artifacts.py --include-wheel --sbom release-sbom.cdx.json
      - name: Privacy-scan staged release artifacts
        run: python scripts/privacy_scan.py --root release-artifacts --max-file-bytes 134217728 --approved-media-manifest constraints/release-media.sha256 --require-approved-media
      - name: Upload release artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ matrix.artifact }}
          path: release-artifacts/
          if-no-files-found: error

  attest:
    needs: build
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    steps:
      - name: Download immutable release artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: rta-smriti-*
          path: attestation-input
      - name: Attest release artifacts
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: attestation-input/**
